themes:
  - code: GAZE
    title_fr: Attention visuelle et oculométrie
    title_en: Visual attention and eye tracking
    text_fr: |-
      Prédire où se pose le regard (saillance, parcours oculaires) sur des images, des vidéos, des œuvres d'art, ...
      L'objectif étant de comprendre le comportement visuel et de l'intégrer dans les modèles d'apprentissage profond.
    text_en: |-
      Predicting where people look (saliency, scanpaths) on images, video, artworks, etc.
      The goal is to understand visual behavior and integrate it into deep learning models.
    keywords:
      - Saliency
      - Scanpaths
      - Eye tracking
      - ETRA
      - Human-in-the-loop
      - Deep Learning
  - code: IQA
    title_fr: Évaluation de la qualité perçue
    title_en: Perceptual quality assessment
    text_fr: Mesurer automatiquement la qualité perçue des images, vidéos, maillages 3D et nuages de points.
    text_en: Measuring the perceived quality of images, video, 3D meshes and point clouds automatically.
    keywords:
      - No-reference IQA
      - Point clouds
      - 3D meshes
      - Stereo
      - Deep Learning
  - code: MED
    title_fr: Imagerie médicale
    title_en: Medical imaging
    text_fr: |-
      Vision par ordinateur et apprentissage profond pour l'imagerie médicale
      Applications: classification, segmentation, perception, prédiction, etc.
      Plusieurs modalités :X-ray, MRI, CT, PET
    text_en: |-
      Computer Vision and Deep Learning for medical imaging
      Applications: classification, segmentation, perception, prediction, etc.
      Several modalities: X-ray, MRI, CT, PET
    keywords:
      - Knee osteoarthritis
      - X-ray
      - Explainability
  - code: HERITAGE
    title_fr: Patrimoine culturel et art
    title_en: Cultural heritage and art
    text_fr: Analyse d'images pour le patrimoine et étude du regard porté sur les œuvres d'art.
    text_en: Image analysis for heritage, and how people look at artworks.
    keywords:
      - Pottery sherds
      - Paintings
      - Art perception
  - code: HUMAN
    title_fr: Expressions faciales et comportement humain
    title_en: Facial expressions and human behaviour
    text_fr: Expressions faciales et comportement humain.
    text_en: Facial expressions and human behaviour.
    keywords:
      - Facial expressions
      - Anti-spoofing
      - Behaviour
