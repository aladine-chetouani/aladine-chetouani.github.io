intro_fr: |-
  J’enseigne depuis 18 ans, soit depuis 2008, au sein de trois établissements (Sorbonne Paris Nord — anciennement Paris 13 —, Sorbonne Université et l’université d’Orléans). Mes interventions s’adressent à des publics allant de la première année de licence jusqu’au Master 2, en français comme en anglais, avec des effectifs variant de 10 à 200 étudiants. J’assure actuellement environ 210 heures d’enseignement par an. Mon activité pédagogique couvre quatre domaines :
  •	Programmation et logiciels : C, C++, Python, Java et Android, développement web, Linux (de la première année au Master 1, avec des groupes pouvant atteindre 200 étudiants).
  •	Intelligence artificielle : introduction à l’apprentissage automatique (*machine learning*) et à l’apprentissage profond (*deep learning*), apprentissage profond avancé, reconnaissance de formes.
  •	Vision par ordinateur et imagerie : systèmes de vision intelligents, analyse vidéo, traitement d’images, codage multimédia, perception.
  •	Systèmes embarqués et objets connectés (IoT) : systèmes embarqués, dispositifs connectés et capteurs — incluant un cours conçu et dispensé en anglais.
  À l’université Sorbonne Paris Nord, j’ai créé ou refondu plusieurs enseignements de niveau Master : systèmes intelligents en vision par ordinateur, analyse vidéo, traitement numérique des images, codage multimédia et apprentissage profond avancé.
intro_en: |-
  I have taught for 18 years, since 2008, in three institutions (Sorbonne Paris Nord, formerly Paris 13; Sorbonne University; University of Orléans), from first-year students to MSc 2, in French and in English, with cohorts from 10 to 200 students. I currently teach about 210 hours per year. My teaching covers four domains:
  •	Programming and software: C, C++, Python, Java and Android, web development, Linux (years 1 to MSc 1, up to 200 students).
  •	Artificial intelligence: introduction to machine learning and deep learning, advanced deep learning, pattern recognition.
  •	Computer vision and imaging: intelligent vision systems, video analysis, image processing, multimedia coding, perception.
  •	Embedded systems and IoT: embedded systems, connected devices and sensors, including a course designed and taught in English.
  At Sorbonne Paris Nord, I created or redesigned several Master’s courses: Intelligent Systems in Computer Vision, Video Analysis, Digital Image Processing, Multimedia Coding and Advanced Deep Learning.
